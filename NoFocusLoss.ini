; NoFocusLoss - Moon Sweepers
; 1 = on, 0 = off. Restart the game after changing anything.

[NoFocusLoss]
; Master switch for the whole mod
Enabled=1

; Keys held while tabbing out (e.g. W) stay pressed in game -> vehicle keeps driving.
; Alt/Ctrl/Shift/Win/Tab are always released.
; 0 = release all keys when tabbing out (only cruise control / autopilot keeps driving)
KeepHeldKeys=1

; Ignore keyboard/mouse while another window is in front
; (so typing in Discord etc. doesn't steer your vehicle)
BlockBackgroundInput=1

; Never lock the mouse cursor to the game window while the game is in the background
ReleaseCursor=1

; Write NoFocusLoss.log to the game folder
Log=1
